<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Pokédex</h1>
        <input
            type="text"
            id="search"
            placeholder="Rechercher un Pokémon..."
        >
    </header>

    <main>

        <!-- Liste des Pokémon -->
        <section id="pokemon-list"></section>

        <!-- Fiche détaillée -->
        <section id="pokemon-details" class="hidden">

            <button id="back-button">← Retour</button>

            <div class="pokemon-card">

                <h2 id="pokemon-name"></h2>

                <img id="pokemon-image" src="" alt="">

                <p id="pokemon-types"></p>

                <div class="info">
                    <p><strong>Numéro :</strong> <span id="pokemon-id"></span></p>
                    <p><strong>Taille :</strong> <span id="pokemon-height"></span></p>
                    <p><strong>Poids :</strong> <span id="pokemon-weight"></span></p>
                </div>

                <h3>Statistiques</h3>

                <div id="pokemon-stats"></div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
